<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIC Golf | 3D Gaussian Splat Viewer</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Rajdhani', sans-serif;
            color: #fff;
        }
        #canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        #loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.5s ease;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(0, 243, 255, 0.2);
            border-top: 4px solid #00f3ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #loading-text {
            font-size: 18px;
            font-weight: bold;
            color: #00f3ff;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div id="loading-overlay">
        <div class="spinner"></div>
        <div id="loading-text">Loading Course Radiance Field...</div>
    </div>

    <canvas id="canvas"></canvas>

    <script src="https://cdn.jsdelivr.net/npm/@mkkellogg/gaussian-splats-3d@0.4.3/build/gaussian-splats-3d.umd.min.js"></script>

    <script>
        // 1. Read the file source passed from map.html via URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        let splatFile = urlParams.get('url');

        // Fallback safety check: if no URL parameter is passed, default to your local file name
        if (!splatFile) {
            splatFile = 'golf.ksplat';
        }

        console.log("Initializing 3D Splat Viewer with asset:", splatFile);

        // 2. Initialize the GaussianSplats3D Viewer instance targeting your canvas
        window.addEventListener('DOMContentLoaded', () => {
            try {
                const viewer = new GaussianSplats3D.Viewer({
                    cameraUp: [0, -1, -0.2], 
                    initialCameraPosition: [-9.08, -6.04, -3.42],
                    initialCameraLookAt: [5.08, 3.04, 1.42],
                    rootElement: document.getElementById('canvas')
                });

                // 3. Load the local .ksplat file
                viewer.addSplatScene(splatFile, {
                    progressiveLoad: true
                })
                .then(() => {
                    console.log("Splat scene loaded successfully!");
                    const overlay = document.getElementById('loading-overlay');
                    overlay.style.opacity = '0';
                    setTimeout(() => {
                        overlay.style.display = 'none';
                    }, 500);

                    viewer.start();
                })
                .catch((error) => {
                    console.error("Error loading splat scene:", error);
                    document.getElementById('loading-text').innerText = "Failed to load 3D course model. Check console.";
                });
            } catch (err) {
                console.error("Initialization error:", err);
                document.getElementById('loading-text').innerText = "Viewer initialization error. Check console.";
            }
        });
    </script>
</body>
</html>
