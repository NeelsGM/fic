<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FIC Golf | 3D Splat Viewer Engine</title>
    <style>
        body, html { 
            margin: 0; 
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000; 
            color: #fff; 
            font-family: 'Rajdhani', sans-serif; 
            overflow: hidden; 
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        #loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.5s ease;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(0, 243, 255, 0.2);
            border-top: 4px solid #00f3ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #loading-text {
            font-size: 18px;
            font-weight: bold;
            color: #00f3ff;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>

    <script type="importmap">
        { "imports": { 
            "three": "./node_modules/three/build/three.module.js",
            "@mkkellogg/gaussian-splats-3d": "./node_modules/@mkkellogg/gaussian-splats-3d/build/gaussian-splats-3d.module.js"
        } }
    </script>
</head>
<body>

    <div id="loading-overlay">
        <div class="spinner"></div>
        <div id="loading-text">Loading Course Radiance Field...</div>
    </div>

    <div id="canvas-container"></div>

    <script type="module">
        import * as GaussianSplats3D from '@mkkellogg/gaussian-splats-3d';
        import * as THREE from 'three';

        // 1. Read the target file passed dynamically from map.html (or fallback to local golf.ksplat)
        const urlParams = new URLSearchParams(window.location.search);
        let targetFile = urlParams.get('url') || 'golf.ksplat';

        console.log("Initializing 3D Splat Engine with source:", targetFile);

        let viewer = null;

        async function initViewer() {
            try {
                viewer = new GaussianSplats3D.Viewer({ 
                    'cameraUp': [0, 1, 0], 
                    'useBuiltInControls': true,
                    'rootElement': document.getElementById('canvas-container')
                });

                let format = GaussianSplats3D.SceneFormat.KSplat;
                if (targetFile.endsWith('.ply')) format = GaussianSplats3D.SceneFormat.Ply;
                if (targetFile.endsWith('.splat')) format = GaussianSplats3D.SceneFormat.Splat;

                await viewer.addSplatScene(targetFile, {
                    'format': format,
                    'showLoadingUI': false // handled by our custom overlay
                });
                
                viewer.start();
                
                // Automated Orientation Fix from your working snippet
                if (viewer.splatMesh) {
                    viewer.splatMesh.quaternion.multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), Math.PI));
                }

                // Fade out custom loader
                const overlay = document.getElementById('loading-overlay');
                overlay.style.opacity = '0';
                setTimeout(() => { overlay.style.display = 'none'; }, 500);

            } catch (err) {
                console.error("Failed to initialize splat viewer:", err);
                document.getElementById('loading-text').innerText = "Status: Load Failed - Check Console";
            }
        }

        initViewer();
    </script>
</body>
</html>
