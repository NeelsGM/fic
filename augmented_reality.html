<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Forged in Carbon - AR Experience</title>
    <!-- Include A-Frame -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <!-- Include AR.js for A-Frame -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: sans-serif;
        }
        /* Splash Screen Overlay */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #111;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        #splash-screen h1 {
            font-size: 24px;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        #splash-screen p {
            font-size: 14px;
            color: #aaa;
            max-width: 300px;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        #start-btn {
            background: #e63946;
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(230, 57, 70, 0.4);
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- Professional Splash Screen -->
    <div id="splash-screen">
        <h1>FORGED IN CARBON</h1>
        <p>Point your camera at the tracking marker to reveal the vehicle inside the container.</p>
        <button id="start-btn" onclick="dismissSplash()">LAUNCH AR EXPERIENCE</button>
    </div>

    <!-- A-Frame AR Scene initialized cleanly in DOM -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">

        <a-assets>
            <a-asset-item id="car-model" src="https://arjs-cors-proxy.herokuapp.com/https://raw.githack.com/femrtnz/threejs-loaders/master/gltf/buggy/buggy.gltf"></a-asset-item>
        </a-assets>

        <!-- Hiro Marker Tracking -->
        <a-marker preset="hiro">
            <!-- Container Structure Proxy -->
            <a-box position="0 0.5 -1" depth="0.1" height="1.2" width="2" color="#2b2b2b"></a-box>
            <a-box position="-1 0.5 -0.5" depth="1" height="1.2" width="0.1" color="#2b2b2b"></a-box>
            <a-box position="1 0.5 -0.5" depth="1" height="1.2" width="0.1" color="#2b2b2b"></a-box>
            <a-box position="0 1.1 -0.5" depth="1.1" height="0.1" width="2.1" color="#1f1f1f"></a-box>

            <!-- Car Model Inside Container -->
            <a-entity 
                gltf-model="#car-model" 
                position="0 0.05 -0.5" 
                rotation="0 0 0" 
                scale="0.6 0.6 0.6"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 10000">
            </a-entity>

            <a-plane position="0 0 -0.5" rotation="-90 0 0" width="2" height="1" color="#111"></a-plane>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        function dismissSplash() {
            // Fade out or hide the splash screen so the active AR.js canvas underneath is fully exposed
            document.getElementById('splash-screen').classList.add('hidden');
        }
    </script>

</body>
</html>
