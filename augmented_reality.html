<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Forged in Carbon - AR Experience</title>
    
    <!-- Import map mapping Three.js modules and MindAR correctly -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
          "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
        }
      }
    </script>

    <style>
        html, body {
            margin: 0; padding: 0;
            width: 100vw; height: 100vh;
            overflow: hidden; background: #000;
        }
        #ar-container {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
        }
        #instructions {
            position: fixed; bottom: 40px; left: 0; right: 0;
            text-align: center; color: #fff; font-family: sans-serif;
            font-size: 16px; text-shadow: 0 1px 4px rgba(0,0,0,0.9);
            z-index: 100; pointer-events: none; letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div id="instructions">Point your camera at the target image</div>
    <div id="ar-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { MindARThree } from 'mindar-image-three';

        document.addEventListener("DOMContentLoaded", async () => {
            // 1. Initialize MindAR Three engine binding directly to container
            const mindarThree = new MindARThree({
                container: document.querySelector("#ar-container"),
                imageTargetSrc: "targets.mind",
                uiLoading: "yes",
                uiError: "yes",
                uiScanning: "yes"
            });

            const { renderer, scene, camera } = mindarThree;

            // 2. Setup lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 1.0);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 1.2);
            directionalLight.position.set(1, 4, 2);
            scene.add(directionalLight);

            // 3. Create Target Anchor (Index 0)
            const anchor = mindarThree.addAnchor(0);

            // 4. Load your optimized GLB car model
            const loader = new GLTFLoader();
            loader.load('car_optimized.glb', (gltf) => {
                const model = gltf.scene;
                model.scale.set(0.5, 0.5, 0.5);
                model.position.set(0, 0, 0);
                model.rotation.set(0, 0, 0);
                
                // Hide model by default until target is tracked
                model.visible = false;
                anchor.group.add(model);

                anchor.onTargetFound = () => {
                    console.log("Target Found!");
                    model.visible = true;
                    document.getElementById('instructions').style.display = 'none';
                };

                anchor.onTargetLost = () => {
                    console.log("Target Lost.");
                    model.visible = false;
                    document.getElementById('instructions').style.display = 'block';
                };
            }, undefined, (error) => {
                console.error("Error loading car_optimized.glb:", error);
            });

            // 5. Start AR engine and open camera stream
            try {
                await mindarThree.start();
                renderer.setAnimationLoop(() => {
                    renderer.render(scene, camera);
                });
                console.log("MindAR camera stream successfully active.");
            } catch (err) {
                console.error("Failed to start MindAR:", err);
                alert("Camera access failed. Ensure you are using HTTPS or localhost.");
            }
        });
    </script>
</body>
</html>
