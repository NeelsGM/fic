<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Forged in Carbon - AR Experience</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
    <style>
        html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; font-family:sans-serif; background:#000; }

        /* AR.js inserts a <video> for the camera feed. Force it to fill the screen
           and sit BEHIND the transparent WebGL canvas. Without this the video is
           1px / offscreen on many mobile browsers -> black screen. */
        video, #arjs-video {
            position:fixed !important;
            top:0 !important; left:0 !important;
            width:100% !important; height:100% !important;
            object-fit:cover !important;
            z-index:0 !important;
            display:block !important;
        }
        .a-canvas, canvas.a-canvas {
            position:fixed !important;
            top:0 !important; left:0 !important;
            width:100% !important; height:100% !important;
            background:transparent !important;
            z-index:1 !important;
        }
        .a-enter-vr, .a-enter-ar, .a-orientation-modal { display:none !important; }

        #splash-screen {
            position:fixed; inset:0; background:#111; color:#fff;
            display:flex; flex-direction:column; justify-content:center; align-items:center;
            z-index:99999; text-align:center; padding:20px; box-sizing:border-box;
        }
        #splash-screen h1 { font-size:24px; margin-bottom:10px; letter-spacing:1px; }
        #splash-screen p { font-size:14px; color:#aaa; max-width:320px; margin-bottom:30px; line-height:1.5; }
        #start-btn {
            background:#e63946; color:#fff; border:none; padding:14px 32px; font-size:16px;
            font-weight:bold; border-radius:6px; cursor:pointer; box-shadow:0 4px 15px rgba(230,57,70,.4);
        }
        #error-msg { color:#e63946; font-size:13px; max-width:320px; margin-top:18px; line-height:1.5; }
        #hint {
            position:fixed; bottom:18px; left:0; right:0; text-align:center;
            color:#fff; font-size:13px; text-shadow:0 1px 3px #000; z-index:10;
        }
        /* Our own camera feed, used as the visible background. */
        #cam-feed {
            position:fixed; top:0; left:0; width:100%; height:100%;
            object-fit:cover; z-index:0; background:#000;
        }
        #debug {
            position:fixed; top:0; left:0; right:0; z-index:20;
            font:11px/1.4 monospace; color:#0f0; background:rgba(0,0,0,.55);
            padding:4px 6px; white-space:pre-wrap;
        }
        .hidden { display:none !important; }
    </style>
</head>
<body>

    <div id="splash-screen">
        <h1>FORGED IN CARBON</h1>
        <p>Point your camera at the Hiro tracking marker to reveal the vehicle inside the container.</p>
        <button id="start-btn">LAUNCH AR EXPERIENCE</button>
        <div id="error-msg" class="hidden"></div>
    </div>

    <div id="hint" class="hidden">Point the camera at the Hiro marker</div>
    <video id="cam-feed" class="hidden" autoplay muted playsinline></video>
    <div id="debug" class="hidden"></div>

    <div id="ar-container"></div>

    <script>
    (function () {
      var btn = document.getElementById('start-btn');
      var splash = document.getElementById('splash-screen');
      var errorBox = document.getElementById('error-msg');
      var hint = document.getElementById('hint');
      var camFeed = document.getElementById('cam-feed');
      var dbg = document.getElementById('debug');
      var camStream = null;

      function log(msg) {
        dbg.classList.remove('hidden');
        dbg.textContent = (msg + '\n' + dbg.textContent).split('\n').slice(0, 6).join('\n');
      }

      function fail(msg) {
        errorBox.textContent = msg;
        errorBox.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'TRY AGAIN';
      }

      function resize() { window.dispatchEvent(new Event('resize')); }

      // Firefox on Android frequently leaves AR.js's own <video> without a
      // stream (or 0x0). Feed it the stream we already hold, and keep our own
      // <video> as the visible background so the user always sees the camera.
      function healArVideo() {
        var v = document.querySelector('#arjs-video') || document.querySelector('video:not(#cam-feed)');
        if (!v) { log('arjs video: missing'); return; }
        if (!v.srcObject || v.videoWidth === 0) {
          try {
            v.srcObject = camStream;
            v.setAttribute('playsinline', '');
            v.muted = true;
            v.play().catch(function () {});
            log('arjs video re-attached');
          } catch (e) { log('attach failed: ' + e.name); }
        }
        v.style.opacity = '0';
        log('arjs video ' + v.videoWidth + 'x' + v.videoHeight);
      }

      function buildScene() {
        var scene = document.createElement('a-scene');
        scene.setAttribute('embedded', '');
        scene.setAttribute('renderer', 'antialias: true; alpha: true; logarithmicDepthBuffer: true');
        scene.setAttribute('vr-mode-ui', 'enabled: false');
        scene.setAttribute('device-orientation-permission-ui', 'enabled: false');
        // No sourceWidth/Height: fixed constraints are rejected by Firefox
        // Android and leave the feed at 0x0 (black screen).
        scene.setAttribute('arjs', 'sourceType: webcam; debugUIEnabled: false; detectionMode: mono; trackingMethod: best;');

        scene.innerHTML = [
          '  <a-assets>',
          '    <a-asset-item id="car-model" src="https://raw.githack.com/femrtnz/threejs-loaders/master/gltf/buggy/buggy.gltf"></a-asset-item>',
          '  </a-assets>',
          '  <a-entity light="type: ambient; intensity: 0.9"></a-entity>',
          '  <a-entity light="type: directional; intensity: 0.6" position="1 3 2"></a-entity>',
          '  <a-marker preset="hiro" smooth="true" smoothCount="5">',
          '    <a-box position="0 0.5 -1" depth="0.1" height="1.2" width="2" color="#2b2b2b"></a-box>',
          '    <a-box position="-1 0.5 -0.5" depth="1" height="1.2" width="0.1" color="#2b2b2b"></a-box>',
          '    <a-box position="1 0.5 -0.5" depth="1" height="1.2" width="0.1" color="#2b2b2b"></a-box>',
          '    <a-box position="0 1.1 -0.5" depth="1.1" height="0.1" width="2.1" color="#1f1f1f"></a-box>',
          '    <a-entity gltf-model="#car-model" position="0 0.05 -0.5" scale="0.6 0.6 0.6"',
          '      animation="property: rotation; to: 0 360 0; loop: true; dur: 10000"></a-entity>',
          '    <a-plane position="0 0 -0.5" rotation="-90 0 0" width="2" height="1" color="#111"></a-plane>',
          '  </a-marker>',
          '  <a-entity camera></a-entity>'
        ].join('\n');

        scene.addEventListener('loaded', function () {
          splash.classList.add('hidden');
          hint.classList.remove('hidden');
          resize();
        });
        // Safety net in case the "loaded" event never fires.
        setTimeout(function () {
          splash.classList.add('hidden');
          hint.classList.remove('hidden');
          resize();
        }, 4000);

        document.getElementById('ar-container').appendChild(scene);

        // AR.js only lays the video/canvas out correctly once the stream is live.
        [500, 1200, 2500].forEach(function (t) {
          setTimeout(function () { resize(); healArVideo(); }, t);
        });
      }

      btn.addEventListener('click', function () {
        errorBox.classList.add('hidden');

        if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
          return fail('Camera access requires HTTPS. Open this page via https://');
        }
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          return fail('This browser cannot access the camera. Open the link in Safari (iOS) or Chrome (Android) — in-app browsers such as Instagram, Facebook or LinkedIn block camera access.');
        }

        btn.disabled = true;
        btn.textContent = 'STARTING CAMERA…';

        // Acquire the camera inside the tap handler and KEEP the stream: we
        // show it ourselves and hand the same stream to AR.js if it fails.
        navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false })
          .then(function (stream) {
            camStream = stream;
            camFeed.srcObject = stream;
            camFeed.classList.remove('hidden');
            return camFeed.play().catch(function () {});
          })
          .then(function () {
            var t = camStream.getVideoTracks()[0];
            var s = t ? t.getSettings() : {};
            log('camera ok ' + (s.width || '?') + 'x' + (s.height || '?'));
            setTimeout(buildScene, 300);
          })
          .catch(function (err) {
            var n = err && err.name;
            if (n === 'NotAllowedError' || n === 'SecurityError') {
              fail('Camera permission was blocked. Tap the padlock/“aA” icon in the address bar, allow Camera for this site, then reload.');
            } else if (n === 'NotFoundError') {
              fail('No camera was found on this device.');
            } else {
              fail('Could not start the camera: ' + (n || 'unknown error'));
            }
          });
      });

      window.addEventListener('orientationchange', function () { setTimeout(resize, 400); });
    })();
    </script>

</body>
</html>
