<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Forged in Carbon - AR Experience</title>
    
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
          "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
        }
      }
    </script>

    <style>
        html, body {
            margin: 0; padding: 0;
            width: 100vw; height: 100vh;
            overflow: hidden; background: transparent;
        }
        #ar-container {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
        }
        #instructions {
            position: fixed; bottom: 40px; left: 0; right: 0;
            text-align: center; color: #fff; font-family: sans-serif;
            font-size: 16px; text-shadow: 0 1px 4px rgba(0,0,0,0.9);
            z-index: 100; pointer-events: none; letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div id="instructions">Point your camera at the target image</div>
    <div id="ar-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { MindARThree } from 'mindar-image-three';

        document.addEventListener("DOMContentLoaded", async () => {
            const mindarThree = new MindARThree({
                container: document.querySelector("#ar-container"),
                imageTargetSrc: "targets.mind",
                uiLoading: "yes",
                uiError: "yes",
                uiScanning: "yes"
            });

            const { renderer, scene, camera } = mindarThree;

            // Force transparency on renderer so the live video feed shows through
            renderer.setClearColor(0x000000, 0);
            scene.background = null;

            // Lighting setup
            const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
            directionalLight.position.set(1, 4, 2);
            scene.add(directionalLight);

            const anchor = mindarThree.addAnchor(0);

            let carModel = null;

            const loader = new GLTFLoader();
            loader.load('car_optimized.glb', (gltf) => {
                carModel = gltf.scene;
                
                // Adjust scale (reduce size if too big)
                carModel.scale.set(0.2, 0.2, 0.2);
                
                // Adjust base orientation if it's lying flat or facing sideways 
                // (e.g., Math.PI / 2 for 90 degrees on X axis if exported upright differently)
                carModel.rotation.set(Math.PI / 1, 1, 2); 
                carModel.position.set(0, 0, 0);
                
                carModel.visible = false;
                anchor.group.add(carModel);

                anchor.onTargetFound = () => {
                    console.log("Target Found!");
                    carModel.visible = true;
                    document.getElementById('instructions').style.display = 'none';
                };

                anchor.onTargetLost = () => {
                    console.log("Target Lost.");
                    carModel.visible = false;
                    document.getElementById('instructions').style.display = 'block';
                };
            }, undefined, (error) => {
                console.error("Error loading car_optimized.glb:", error);
            });

            try {
                await mindarThree.start();
                
                // Animation loop with frame rendering
                renderer.setAnimationLoop(() => {
                    renderer.render(scene, camera);
                });
                
                console.log("MindAR successfully running.");
            } catch (err) {
                console.error("Failed to start MindAR:", err);
            }
        });
    </script>
</body>
</html>
