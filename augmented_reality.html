<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Forged in Carbon - AR Experience</title>
    
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- GLTFLoader for loading the compressed .glb mesh -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <!-- MindAR Image Tracking Pure JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.7/dist/mindar-image-three.prod.js"></script>
    
    <style>
        html, body { 
            margin: 0; padding: 0; 
            width: 100vw; height: 100vh; 
            overflow: hidden; background: #000; 
        }
        #ar-container {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
        }
        #hint {
            position: fixed; bottom: 24px; left: 0; right: 0; text-align: center;
            color: #fff; font-size: 14px; text-shadow: 0 1px 4px #000; z-index: 10;
            font-family: sans-serif; pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="hint">Point your camera at the target image</div>
    <div id="ar-container"></div>

    <script>
    document.addEventListener("DOMContentLoaded", async function() {
        // 1. Initialize the MindAR ThreeJS Engine instance
        const mindarThree = new window.MINDAR.IMAGE.MindARThree({
            container: document.querySelector("#ar-container"),
            imageTargetSrc: "targets.mind",
        });

        const {renderer, scene, camera} = mindarThree;

        // 2. Add lighting to the Three.js scene (Ambient + Internal Container Point Light)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(1, 4, 2);
        scene.add(directionalLight);

        // 3. Create the Image Target Anchor (Index 0)
        const anchor = mindarThree.addAnchor(0);

        // Simulated internal container point light anchored directly to the box space
        const internalLight = new THREE.PointLight(0xffffff, 2.0, 3.0);
        internalLight.position.set(0, 0.2, -0.4);
        anchor.group.add(internalLight);

        // 4. Load the compressed .glb car model
        const loader = new THREE.GLTFLoader();
        loader.load('car_optimized.glb', (gltf) => {
            const model = gltf.scene;
            // Scale and position model so it sits recessed inside the target space
            model.scale.set(0.7, 0.7, 0.7);
            model.position.set(0, 0, -0.3);
            model.rotation.set(0, 0, 0);
            
            anchor.group.add(model);
            console.log("Car model loaded and anchored successfully.");
        }, undefined, (error) => {
            console.error("An error occurred loading the GLB model:", error);
        });

        // 5. Start the MindAR engine and camera stream
        try {
            await mindarThree.start();
            renderer.setAnimationLoop(() => {
                renderer.render(scene, camera);
            });
            console.log("MindAR camera stream started successfully.");
        } catch (error) {
            console.error("Failed to start MindAR engine/camera:", error);
            alert("Could not start camera feed. Ensure permissions are allowed and you are using HTTPS.");
        }
    });
    </script>
</body>
</html>
