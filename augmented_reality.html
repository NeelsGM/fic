<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Forged in Carbon - AR Experience</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
    <style>
        html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; font-family:sans-serif; background:#000; }
        
        /* Ensure AR.js video fills the screen correctly */
        video, #arjs-video {
            position: fixed !important; top: 0 !important; left: 0 !important;
            width: 100vw !important; height: 100vh !important;
            object-fit: cover !important; z-index: 0 !important; display: block !important;
        }
        .a-canvas, canvas.a-canvas {
            position: fixed !important; top: 0 !important; left: 0 !important;
            width: 100vw !important; height: 100vh !important;
            background: transparent !important; z-index: 1 !important;
        }
        .a-enter-vr, .a-enter-ar, .a-orientation-modal { display:none !important; }
        
        #splash-screen {
            position:fixed; inset:0; background:#111; color:#fff;
            display:flex; flex-direction:column; justify-content:center; align-items:center;
            z-index:99999; text-align:center; padding:20px; box-sizing:border-box;
        }
        #splash-screen h1 { font-size:24px; margin-bottom:10px; letter-spacing:1px; }
        #splash-screen p { font-size:14px; color:#aaa; max-width:320px; margin-bottom:24px; line-height:1.5; }
        #start-btn {
            background:#e63946; color:#fff; border:none; padding:14px 32px; font-size:16px;
            font-weight:bold; border-radius:6px; cursor:pointer; box-shadow:0 4px 15px rgba(230,57,70,.4);
        }
        #splash-screen a { color:#e63946; font-size:13px; margin-top:18px; text-decoration: none; }
        #error-msg { color:#e63946; font-size:13px; max-width:320px; margin-top:18px; line-height:1.5; }
        #hint {
            position:fixed; bottom:18px; left:0; right:0; text-align:center;
            color:#fff; font-size:13px; text-shadow:0 1px 3px #000; z-index:10;
        }
        #debug {
            position:fixed; top:0; left:0; right:0; z-index:20;
            font:11px/1.4 monospace; color:#0f0; background:rgba(0,0,0,.55);
            padding:4px 6px; white-space:pre-wrap; display: none;
        }
        .hidden { display:none !important; }
    </style>
</head>
<body>

    <!-- Splash Screen -->
    <div id="splash-screen">
        <h1>FORGED IN CARBON</h1>
        <p>Point your camera at the Hiro tracking marker to reveal the vehicle inside the container.</p>
        <button id="start-btn">LAUNCH AR EXPERIENCE</button>
        <a id="marker-link" href="https://raw.githubusercontent.com/AR-js-org/AR.js/master/data/images/hiro.png" target="_blank" rel="noopener">Open / print the Hiro marker</a>
        <button id="show-marker-btn" style="margin-top:12px; background:transparent; color:#e63946; border:1px solid #e63946; padding:10px 24px; font-size:14px; border-radius:6px; cursor:pointer;">Display marker full-screen on this device</button>
        <div id="error-msg" class="hidden"></div>
    </div>

    <!-- Fullscreen Marker View -->
    <div id="marker-fullscreen" class="hidden" style="position:fixed; inset:0; background:#fff; display:flex; justify-content:center; align-items:center; z-index:99999; cursor:pointer;">
        <img src="https://raw.githubusercontent.com/AR-js-org/AR.js/master/data/images/hiro.png" alt="Hiro marker" style="max-width:95vw; max-height:95vh; width:auto; height:auto; display:block;">
        <div style="position:absolute; bottom:12px; left:0; right:0; text-align:center; color:#000; font-size:14px; padding:8px; background:rgba(255,255,255,.8);">Tap anywhere to close</div>
    </div>

    <div id="hint" class="hidden">Point the camera at the Hiro marker.</div>
    <div id="debug"></div>

    <!-- Static AR Scene (Pre-loaded in DOM so AR.js hooks properly) -->
    <a-scene embedded renderer="antialias: true; alpha: true; logarithmicDepthBuffer: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono; patternRatio: 0.5;">

        <a-assets timeout="15000">
            <a-asset-item id="car-model" src="https://cdn.jsdelivr.net/gh/femrtnz/threejs-loaders@master/gltf/buggy/buggy.gltf"></a-asset-item>
        </a-assets>

        <a-entity light="type: ambient; intensity: 0.9"></a-entity>
        <a-entity light="type: directional; intensity: 0.6" position="1 3 2"></a-entity>

        <!-- Marker tracking -->
        <a-marker id="marker" preset="hiro" smooth="true" smoothCount="5" smoothTolerance="0.01" smoothThreshold="2">
            <!-- Red cube fallback / probe -->
            <a-box id="probe" position="0 0.25 0" width="0.5" height="0.5" depth="0.5" color="#e63946"></a-box>
            
            <!-- Container Proxy -->
            <a-box position="0 0.5 -1" depth="0.1" height="1.2" width="2" color="#2b2b2b"></a-box>
            <a-box position="-1 0.5 -0.5" depth="1" height="1.2" width="0.1" color="#2b2b2b"></a-box>
            <a-box position="1 0.5 -0.5" depth="1" height="1.2" width="0.1" color="#2b2b2b"></a-box>
            <a-box position="0 1.1 -0.5" depth="1.1" height="0.1" width="2.1" color="#1f1f1f"></a-box>

            <!-- Car Model -->
            <a-entity id="car" gltf-model="#car-model" position="0 0.05 -0.5" scale="0.6 0.6 0.6"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 10000"></a-entity>

            <a-plane position="0 0 -0.5" rotation="-90 0 0" width="2" height="1" color="#111"></a-plane>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
    (function () {
      var btn = document.getElementById('start-btn');
      var splash = document.getElementById('splash-screen');
      var errorBox = document.getElementById('error-msg');
      var hint = document.getElementById('hint');
      var dbg = document.getElementById('debug');
      var markerBtn = document.getElementById('show-marker-btn');
      var markerFs = document.getElementById('marker-fullscreen');

      if (markerBtn && markerFs) {
        markerBtn.addEventListener('click', function () {
          markerFs.classList.remove('hidden');
          if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
        });
        markerFs.addEventListener('click', function () {
          markerFs.classList.add('hidden');
          if (document.exitFullscreen) document.exitFullscreen();
        });
      }

      function log(msg) {
        dbg.style.display = 'block';
        dbg.textContent = (msg + '\n' + dbg.textContent).split('\n').slice(0, 7).join('\n');
      }
      function fail(msg) {
        errorBox.textContent = msg;
        errorBox.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'TRY AGAIN';
      }

      var marker = document.getElementById('marker');
      marker.addEventListener('markerFound', function () {
        log('MARKER FOUND');
        hint.classList.add('hidden');
      });
      marker.addEventListener('markerLost', function () {
        log('marker lost');
        hint.classList.remove('hidden');
      });

      btn.addEventListener('click', function () {
        errorBox.classList.add('hidden');

        if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
          return fail('Camera access requires HTTPS.');
        }
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          return fail('Browser does not support camera access.');
        }

        btn.disabled = true;
        btn.textContent = 'STARTING CAMERA…';

        // Trigger user gesture permission request cleanly
        navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false })
          .then(function (stream) {
            // Stop this temporary stream so AR.js can open its own video feed instance cleanly
            stream.getTracks().forEach(function (t) { t.stop(); });
            log('permission ok');
            
            // Hide splash screen and expose the pre-loaded AR scene
            splash.classList.add('hidden');
            hint.classList.remove('hidden');
            window.dispatchEvent(new Event('resize'));
          })
          .catch(function (err) {
            fail('Camera error: ' + (err && err.name ? err.name : 'unknown'));
          });
      });
    })();
    </script>
</body>
</html>
