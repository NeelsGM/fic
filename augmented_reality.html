<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Forged in Carbon - AR Experience</title>
    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <!-- MindAR A-Frame Component -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.8/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
        html, body { 
            margin: 0; padding: 0; 
            width: 100vw; height: 100vh; 
            overflow: hidden; background: #000; 
        }
        /* Ensure A-Frame canvas sits cleanly over the video feed */
        .a-canvas, canvas.a-canvas {
            position: fixed !important; 
            top: 0 !important; left: 0 !important;
            width: 100vw !important; height: 100vh !important;
        }
        .a-enter-vr, .a-enter-ar, .a-orientation-modal { display: none !important; }
    </style>
</head>
<body>

    <!-- MindAR Scene with explicit UI helpers enabled -->
    <a-scene 
        mindar-image="imageTargetSrc: targets.mind; autoStart: true; uiLoading: yes; uiError: yes; uiScanning: yes;" 
        embedded 
        renderer="antialias: true; alpha: true; logarithmicDepthBuffer: true; physicallyCorrectLights: false;" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false">

        <a-assets timeout="15000">
            <a-asset-item id="car-model" src="car_optimized.glb"></a-asset-item>
        </a-assets>

        <!-- Ambient lighting -->
        <a-entity light="type: ambient; intensity: 0.6"></a-entity>
        
        <!-- Directional surface light -->
        <a-entity light="type: directional; intensity: 0.8" position="1 4 2"></a-entity>

        <!-- Target Anchor (Index 0 matches your targets.mind file) -->
        <a-entity mindar-image-target="targetIndex: 0">
            <!-- Internal Container Light Depth Glow -->
            <a-entity light="type: point; intensity: 2.0; distance: 3.0; color: #ffffff" position="0 0.2 -0.4"></a-entity>

            <!-- Car Model -->
            <a-entity 
                id="car-entity"
                gltf-model="#car-model" 
                position="0 0 -0.3" 
                rotation="0 0 0" 
                scale="0.7 0.7 0.7"
                visible="false">
            </a-entity>
        </a-entity>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
    document.addEventListener("DOMContentLoaded", function() {
        var carEntity = document.getElementById('car-entity');

        carEntity.addEventListener('model-loaded', function () {
            console.log("Car model loaded successfully into scene.");
            carEntity.setAttribute('visible', 'true');
        });
    });
    </script>
</body>
</html>
