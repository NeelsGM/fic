<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Forged in Carbon - AR Experience</title>
    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <!-- MindAR A-Frame Component -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.8/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
        html, body { 
            margin: 0; padding: 0; 
            width: 100vw; height: 100vh; 
            overflow: hidden; background: #000; 
        }
        .a-enter-vr, .a-enter-ar, .a-orientation-modal { display: none !important; }
    </style>
</head>
<body>

    <a-scene 
        mindar-image="imageTargetSrc: targets.mind; uiLoading: yes; uiError: yes; uiScanning: yes;" 
        embedded 
        renderer="precision: mediump; antialias: true; alpha: true; colorManagement: true;" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false">

        <a-assets timeout="15000">
            <a-asset-item id="car-model" src="car_optimized.glb"></a-asset-item>
        </a-assets>

        <a-entity light="type: ambient; intensity: 1"></a-entity>
        <a-entity light="type: directional; intensity: 0.8" position="1 4 2"></a-entity>

        <!-- Target Anchor -->
        <a-entity id="target-anchor" mindar-image-target="targetIndex: 0">
            <!-- Car Model (Hidden until target is found) -->
            <a-entity 
                id="car-entity"
                gltf-model="#car-model" 
                position="0 0 0" 
                rotation="0 0 0" 
                scale="0.5 0.5 0.5"
                visible="false">
            </a-entity>
        </a-entity>

        <a-entity camera position="0 0 0" look-controls="enabled: false"></a-entity>
    </a-scene>

    <script>
    document.addEventListener("DOMContentLoaded", function() {
        var targetAnchor = document.getElementById('target-anchor');
        var carEntity = document.getElementById('car-entity');
        var modelLoaded = false;

        carEntity.addEventListener('model-loaded', function () {
            console.log("Model loaded successfully.");
            modelLoaded = true;
        });

        targetAnchor.addEventListener("targetFound", function() {
            console.log("Target found!");
            if (modelLoaded) {
                carEntity.setAttribute('visible', 'true');
            }
        });

        targetAnchor.addEventListener("targetLost", function() {
            console.log("Target lost.");
            carEntity.setAttribute('visible', 'false');
        });
    });
    </script>
</body>
</html>
