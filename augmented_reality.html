<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Shipping Container Car Reveal AR Demo</title>
    <!-- Include A-Frame -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <!-- Include AR.js for A-Frame -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
        /* Simple overlay UI instructions for users */
        #ui-overlay {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 20px;
            font-family: sans-serif;
            border-radius: 8px;
            text-align: center;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <h3>Forged in Carbon AR</h3>
        <p>Point your camera at the Hiro Marker to reveal the car inside the container.</p>
    </div>

    <!-- A-Frame AR Scene -->
    <- embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;" ->
    <a-scene embedded arjs>

        <!-- Asset Management for 3D Models -->
        <a-assets>
            <!-- Placeholder GLB car model (Replace with your actual shipping container & car assets) -->
            <a-asset-item id="car-model" src="https://arjs-cors-proxy.herokuapp.com/https://raw.githack.com/femrtnz/threejs-loaders/master/gltf/buggy/buggy.gltf"></a-asset-item>
        </a-assets>

        <!-- Define Marker (Using default 'hiro' marker for testing. Change to custom .patt later) -->
        <a-marker preset="hiro">

            <!-- Container Structure Proxy (Scaled Box representing the Container Walls) -->
            <!-- Back Wall -->
            <a-box position="0 0.5 -1" depth="0.1" height="1.2" width="2" color="#2b2b2b"></a-box>
            <!-- Left Wall -->
            <a-box position="-1 0.5 -0.5" depth="1" height="1.2" width="0.1" color="#2b2b2b"></a-box>
            <!-- Right Wall -->
            <a-box position="1 0.5 -0.5" depth="1" height="1.2" width="0.1" color="#2b2b2b"></a-box>
            <!-- Roof -->
            <a-box position="0 1.1 -0.5" depth="1.1" height="0.1" width="2.1" color="#1f1f1f"></a-box>

            <!-- The Car Positioned Inside the Container -->
            <a-entity 
                gltf-model="#car-model" 
                position="0 0.05 -0.5" 
                rotation="0 0 0" 
                scale="0.6 0.6 0.6"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 10000">
            </a-entity>

            <!-- Optional Floor Shadow / Base Inside Container -->
            <a-plane position="0 0 -0.5" rotation="-90 0 0" width="2" height="1" color="#111"></a-plane>

        </a-marker>

        <!-- Camera Entity -->
        <a-entity camera></a-entity>

    </a-scene>

</body>
</html>
